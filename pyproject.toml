[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acoes-b3-monitor"
version = "0.1.0"
description = "Monitor de acoes B3: alertas de preco e noticias via Telegram"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.28",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "aiosqlite>=0.20",
]

[project.scripts]
acoes-b3-monitor = "acoes_b3_monitor.main:main"

[tool.hatch.build.targets.wheel]
packages = ["acoes_b3_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
