openapi: "3.1.0"
info:
  title: acoes-b3-monitor — External API Calls Contract
  description: |
    Este serviço não expõe uma API HTTP própria (roda como daemon).
    Este documento descreve as chamadas externas que os módulos fazem e
    as assinaturas internas de cada módulo (como contrato de integração).

    Módulos e funções principais:
      - quote_collector.fetch_quotes(tickers) -> list[Quote]
      - news_collector.fetch_news(tickers) -> list[NewsItem]
      - alert_engine.evaluate(quotes, rules) -> list[AlertEvent]
      - news_analyzer.analyze(item) -> NewsAnalysis
      - briefing_builder.build(quotes, analyses) -> DailyBriefing
      - notifier.send_alert(event, quote) -> None
      - notifier.send_news_analysis(analysis, item) -> None
      - notifier.send_briefing(briefing) -> None
      - storage.save_quote(quote) -> None
      - storage.save_news_item(item) -> None  (UNIQUE guid — ignora duplicado)
      - storage.save_alert_event(event) -> None
      - storage.get_recent_alert(ticker, within_minutes) -> AlertEvent | None
      - storage.get_news_since(ticker, since_dt) -> list[NewsItem]
  version: "1.0.0"

# ---------------------------------------------------------------------------
# Dependências externas — chamadas que o serviço faz
# ---------------------------------------------------------------------------

paths:

  # ---------- brapi.dev — cotação ----------

  /brapi/quote/{tickers}:
    get:
      summary: Busca cotação de um ou mais tickers (multi-ticker em 1 request)
      description: |
        Chamado por quote_collector.fetch_quotes().
        Free: somente PETR4, VALE3, ITUB4, MGLU3 sem token.
        Auth via query param ?token= (não header) quando BRAPI_TOKEN está configurado.
        Regra: sempre fazer multi-ticker num único GET (economiza quota).
      servers:
        - url: https://brapi.dev/api
      parameters:
        - name: tickers
          in: path
          required: true
          description: "Tickers separados por vírgula. Ex: PETR4,VALE3,ITUB4,MGLU3"
          schema:
            type: string
            example: "PETR4,VALE3,ITUB4,MGLU3"
        - name: token
          in: query
          required: false
          description: "BRAPI_TOKEN — omitir no free (só 4 tickers)"
          schema:
            type: string
      responses:
        "200":
          description: Cotação obtida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrapiQuoteResponse'
              example:
                results:
                  - symbol: "PETR4"
                    longName: "Petroleo Brasileiro SA Pfd"
                    currency: "BRL"
                    regularMarketPrice: 44.48
                    regularMarketDayHigh: 44.75
                    regularMarketDayLow: 43.87
                    regularMarketChange: -0.47
                    regularMarketChangePercent: -1.05
                    regularMarketTime: "2026-05-22T21:30:30.000Z"
                    regularMarketPreviousClose: 44.42
                    regularMarketOpen: 44.74
                    regularMarketVolume: 39610500
                    marketCap: 613085621299
                requestedAt: "2026-05-24T18:20:22.014Z"
                took: 140
        "401":
          description: Token ausente ou inválido — ou ticker fora da allowlist free
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrapiError'
              examples:
                missing_token:
                  value:
                    error: true
                    message: "Token de autenticacao nao fornecido"
                    code: "MISSING_TOKEN"
                invalid_token:
                  value:
                    error: true
                    message: "Token de autenticacao invalido ou inativo"
                    code: "INVALID_TOKEN"

  # ---------- InfoMoney RSS ----------

  /infomoney/feed:
    get:
      summary: RSS geral de mercado — InfoMoney
      description: |
        Chamado por news_collector.
        Encoding: latin-1 / ISO-8859-1. Usar feedparser ou forçar resp.encoding = "latin-1".
        User-Agent obrigatório para evitar 403.
      servers:
        - url: https://www.infomoney.com.br
      parameters:
        - $ref: '#/components/parameters/UserAgent'
      responses:
        "200":
          description: RSS 2.0 XML com itens de notícia
          content:
            application/rss+xml:
              schema:
                $ref: '#/components/schemas/RssResponse'

  /infomoney/mercados/feed:
    get:
      summary: RSS de mercados — InfoMoney
      servers:
        - url: https://www.infomoney.com.br

  # ---------- Money Times RSS ----------

  /moneytimes/tag/{empresa}/feed:
    get:
      summary: RSS filtrado por tag de empresa — Money Times
      description: |
        Filtro nativo por empresa. Ex: /tag/petrobras/feed/ para PETR4.
        Mapeamento ticker -> slug de tag deve ser configurável (ex: PETR4 -> petrobras).
        Encoding: UTF-8 (sem armadilha de latin-1 neste feed).
      servers:
        - url: https://www.moneytimes.com.br
      parameters:
        - name: empresa
          in: path
          required: true
          schema:
            type: string
            example: "petrobras"
      responses:
        "200":
          description: RSS 2.0 XML filtrado por empresa

  # ---------- Google News RSS ----------

  /google-news/rss/search:
    get:
      summary: Busca RSS no Google News por empresa
      description: |
        Uma query por ticker. Ex: q=Petrobras+PETR4
        ATENÇÃO: <link> é URL redirect ofuscada do Google (news.google.com/rss/articles/...).
        news_collector DEVE seguir o redirect (httpx follow_redirects=True) para armazenar
        a URL real do artigo no NewsItem.url.
      servers:
        - url: https://news.google.com
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            example: "Petrobras PETR4"
        - name: hl
          in: query
          schema:
            type: string
            default: "pt-BR"
        - name: gl
          in: query
          schema:
            type: string
            default: "BR"
        - name: ceid
          in: query
          schema:
            type: string
            default: "BR:pt-419"
      responses:
        "200":
          description: RSS 2.0 XML em PT-BR

  # ---------- CVM IPE — Fatos Relevantes ----------

  /cvm/ipe/{ano}.zip:
    get:
      summary: Download do dataset IPE da CVM (fatos relevantes do ano)
      description: |
        Chamado 1x/dia às 06:00 BRT por news_collector.
        ZIP contém 1 CSV: ipe_cia_aberta_<ano>.csv
        Delimitador: ; (ponto-e-vírgula)
        Encoding: latin-1
        Filtrar: Categoria == "Fato Relevante"
        Dedup: campo Protocolo_Entrega (UNIQUE por documento; versões incrementam Versao mas mesmo Protocolo)
        Link para PDF: campo Link_Download (URL do RAD)
      servers:
        - url: https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/IPE/DADOS
      parameters:
        - name: ano
          in: path
          required: true
          schema:
            type: string
            example: "ipe_cia_aberta_2026"
      responses:
        "200":
          description: Arquivo ZIP com CSV de fatos relevantes

  # ---------- Telegram Bot API ----------

  /telegram/sendMessage:
    post:
      summary: Envia mensagem para o chat configurado
      description: |
        Chamado por notifier.send_message().
        parse_mode=HTML para formatação.
        Tratar 429 (Too Many Requests) com retry após retry_after segundos.
        Tratar 400 (Bad Request) se message too long — truncar em 4096 chars.
      servers:
        - url: https://api.telegram.org/bot{token}
          variables:
            token:
              description: TELEGRAM_BOT_TOKEN do .env
              default: ""
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramSendMessage'
            example:
              chat_id: "123456789"
              text: "[ALERTA PETR4] Preço atual: R$ 41,20\nGatilho atingido: R$ 42,00"
              parse_mode: "HTML"
      responses:
        "200":
          description: Mensagem enviada com sucesso
          content:
            application/json:
              example:
                ok: true
                result:
                  message_id: 42
                  chat:
                    id: 123456789
                  text: "[ALERTA PETR4] ..."
        "400":
          description: Bad Request (ex: chat_id inválido, mensagem muito longa)
          content:
            application/json:
              example:
                ok: false
                error_code: 400
                description: "Bad Request: message text is empty"
        "429":
          description: Rate limit — retry após retry_after segundos
          content:
            application/json:
              example:
                ok: false
                error_code: 429
                parameters:
                  retry_after: 5

  # ---------- Anthropic API — análise de notícias ----------

  /anthropic/messages:
    post:
      summary: Análise de sentimento e resumo de notícia via Claude
      description: |
        Chamado por news_analyzer.analyze().
        System prompt: instrui Claude a classificar sentimento (POSITIVO/NEUTRO/NEGATIVO)
        e gerar resumo de 1–4 frases SEM prever preço, ganho/perda ou recomendar compra/venda.
        Retorno esperado em JSON estruturado (usar prefill + json mode).
        Model configurável via env ANTHROPIC_MODEL (default: claude-haiku-3-5 para custo).
        Logar input_tokens e output_tokens por chamada para rastreabilidade de custo.
      servers:
        - url: https://api.anthropic.com/v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
            example:
              model: "claude-haiku-3-5"
              max_tokens: 256
              system: |
                Você é um analista de notícias financeiras. Dado o título e resumo de uma
                notícia sobre uma empresa B3, responda em JSON com:
                {"sentiment": "POSITIVO|NEUTRO|NEGATIVO", "summary": "<1-4 frases em PT-BR>"}
                NUNCA preveja preço, ganho, perda ou faça recomendação de compra ou venda.
              messages:
                - role: "user"
                  content: |
                    Notícia: Vale anuncia paralisação emergencial em mina de MG
                    Resumo: A mineradora paralisou operações em mina após incidente técnico...
      responses:
        "200":
          description: Análise gerada
          content:
            application/json:
              example:
                id: "msg_01XFDUDYJgAACKBRQKiGvmGm"
                content:
                  - type: "text"
                    text: '{"sentiment": "NEGATIVO", "summary": "Vale interrompeu operações em uma mina de MG por motivo técnico. O incidente pode afetar volumes de produção no curto prazo."}'
                usage:
                  input_tokens: 120
                  output_tokens: 48
        "529":
          description: Overloaded — retry com backoff exponencial

# ---------------------------------------------------------------------------
# Componentes reutilizáveis
# ---------------------------------------------------------------------------

components:
  parameters:
    UserAgent:
      name: User-Agent
      in: header
      required: false
      schema:
        type: string
        default: "Mozilla/5.0 (compatible; acoes-b3-monitor/1.0)"

  schemas:

    BrapiQuoteResponse:
      type: object
      required: [results, requestedAt]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BrapiQuoteItem'
        requestedAt:
          type: string
          format: date-time
          description: "UTC timestamp do request"
        took:
          type: integer
          description: "Latência interna brapi em ms"

    BrapiQuoteItem:
      type: object
      required: [symbol, regularMarketPrice, regularMarketTime]
      properties:
        symbol:
          type: string
          example: "PETR4"
        longName:
          type: string
        currency:
          type: string
          example: "BRL"
        regularMarketPrice:
          type: number
          format: float
        regularMarketDayHigh:
          type: number
          format: float
        regularMarketDayLow:
          type: number
          format: float
        regularMarketChange:
          type: number
          format: float
          description: "Variação em R$ vs fechamento anterior"
        regularMarketChangePercent:
          type: number
          format: float
          description: "Variação em % vs fechamento anterior"
        regularMarketTime:
          type: string
          format: date-time
          description: "UTC — timestamp do dado (com delay ~15min no free)"
        regularMarketPreviousClose:
          type: number
          format: float
        regularMarketOpen:
          type: number
          format: float
        regularMarketVolume:
          type: integer
        marketCap:
          type: integer

    BrapiError:
      type: object
      required: [error, message, code]
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
        code:
          type: string
          enum: [MISSING_TOKEN, INVALID_TOKEN]

    RssResponse:
      type: object
      description: |
        RSS 2.0 XML parseado. Campos relevantes de cada <item>:
        - title: string
        - link: URL do artigo (Google News: redirect ofuscado — DEVE ser resolvido)
        - guid: identificador único
        - pubDate: RFC 822 datetime
        - category[]: categorias (útil para associar ticker em InfoMoney)
        - description: CDATA com HTML (texto do artigo)

    TelegramSendMessage:
      type: object
      required: [chat_id, text]
      properties:
        chat_id:
          type: string
          description: "TELEGRAM_CHAT_ID do .env"
        text:
          type: string
          maxLength: 4096
        parse_mode:
          type: string
          enum: [HTML, Markdown, MarkdownV2]
          default: HTML

    AnthropicMessagesRequest:
      type: object
      required: [model, max_tokens, messages]
      properties:
        model:
          type: string
          example: "claude-haiku-3-5"
        max_tokens:
          type: integer
          minimum: 64
          maximum: 512
          description: "256 é suficiente para análise de notícia individual"
        system:
          type: string
          description: "System prompt com instrução de fronteira (sem previsão de preço)"
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string

    # Resposta esperada do Claude (JSON embutido no content[0].text)
    ClaudeNewsAnalysisPayload:
      type: object
      required: [sentiment, summary]
      properties:
        sentiment:
          type: string
          enum: [POSITIVO, NEUTRO, NEGATIVO]
        summary:
          type: string
          description: "1–4 frases em PT-BR. Sem previsão de preço ou recomendação."
          minLength: 10
          maxLength: 800

# ---------------------------------------------------------------------------
# Notas de implementação
# ---------------------------------------------------------------------------
# 1. brapi: sempre multi-ticker num único GET. Tratar MISSING_TOKEN e INVALID_TOKEN
#    separadamente (MISSING = variável não configurada; INVALID = token expirado).
# 2. RSS InfoMoney e CVM IPE: latin-1. Usar feedparser (detecta) ou forçar encoding.
# 3. Google News: seguir redirect do <link> para obter URL real antes de persistir.
# 4. CVM IPE: baixar 1x/dia, dedup por Protocolo_Entrega, guardar set de vistos no storage.
# 5. Telegram: truncar mensagem a 4096 chars; retry em 429 com retry_after.
# 6. Anthropic: logar tokens consumidos por chamada; usar modelo barato (haiku) por default.
#    ANTHROPIC_MODEL=claude-haiku-3-5 configurável via .env.
# 7. Nenhum módulo deve fazer chamadas externas diretamente — sempre via função do módulo
#    correspondente (ex: quote_collector, news_collector, notifier). Facilita mock em testes.
